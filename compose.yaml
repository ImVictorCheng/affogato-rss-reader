name: affogato-rss-reader

x-reader-image: &reader-image ghcr.io/OWNER/affogato-rss-reader:0.3.0
x-affogato-release:
  version: "0.3.0"
  reader-digest: READER_DIGEST

services:
  log-init:
    image: *reader-image
    user: "0:0"
    restart: "no"
    command:
      - sh
      - -c
      - |
        mkdir -p /app/logs /app/update-control
        chown 10001:10001 /app/logs
        chmod 0755 /app/logs
        chown 10001:0 /app/update-control
        chmod 0770 /app/update-control
    volumes:
      - ./logs:/app/logs
      - affogato-rss-reader-update-control:/app/update-control
    tmpfs:
      - /app/data
      - /app/secrets

  reader:
    image: *reader-image
    restart: unless-stopped
    depends_on:
      log-init:
        condition: service_completed_successfully
    ports:
      - "${AFFOGATO_RSS_READER_BIND_ADDRESS:-0.0.0.0}:${AFFOGATO_RSS_READER_PORT:-8787}:8787"
    environment:
      FORWARDED_ALLOW_IPS: "${AFFOGATO_RSS_READER_FORWARDED_ALLOW_IPS:-127.0.0.1}"
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      ALL_PROXY: "${ALL_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-127.0.0.1,localhost}"
      AFFOGATO_RSS_READER_DATA_DIR: /app/data
      AFFOGATO_RSS_READER_TIMEZONE: "${AFFOGATO_RSS_READER_TIMEZONE:-UTC}"
      AFFOGATO_RSS_READER_AUTH_MODE: "${AFFOGATO_RSS_READER_AUTH_MODE:-owner}"
      AFFOGATO_RSS_READER_DEBUG: "${AFFOGATO_RSS_READER_DEBUG:-false}"
      AFFOGATO_RSS_READER_COOKIE_SECURE: "${AFFOGATO_RSS_READER_COOKIE_SECURE:-false}"
      AFFOGATO_RSS_READER_SCHEDULER_ENABLED: "${AFFOGATO_RSS_READER_SCHEDULER_ENABLED:-true}"
      AFFOGATO_RSS_READER_SYNC_ON_STARTUP: "${AFFOGATO_RSS_READER_SYNC_ON_STARTUP:-false}"
      AFFOGATO_RSS_READER_TRANSLATION_ENABLED: "${AFFOGATO_RSS_READER_TRANSLATION_ENABLED:-false}"
      AFFOGATO_RSS_READER_TRANSLATION_TARGET: "${AFFOGATO_RSS_READER_TRANSLATION_TARGET:-zh-CN}"
      AFFOGATO_RSS_READER_TRANSLATION_PROVIDER: "${AFFOGATO_RSS_READER_TRANSLATION_PROVIDER:-google-gtx}"
      AFFOGATO_RSS_READER_TRANSLATION_FALLBACK_MODE: "${AFFOGATO_RSS_READER_TRANSLATION_FALLBACK_MODE:-automatic}"
      AFFOGATO_RSS_READER_TRANSLATION_REQUEST_TIMEOUT_SECONDS: "${AFFOGATO_RSS_READER_TRANSLATION_REQUEST_TIMEOUT_SECONDS:-30}"
      AFFOGATO_RSS_READER_TRANSLATION_MAX_ATTEMPTS: "${AFFOGATO_RSS_READER_TRANSLATION_MAX_ATTEMPTS:-4}"
      AFFOGATO_RSS_READER_TRANSLATION_RETRY_BASE_SECONDS: "${AFFOGATO_RSS_READER_TRANSLATION_RETRY_BASE_SECONDS:-2}"
      AFFOGATO_RSS_READER_TRANSLATION_LLM_BASE_URL: "${AFFOGATO_RSS_READER_TRANSLATION_LLM_BASE_URL:-https://api.openai.com/v1}"
      AFFOGATO_RSS_READER_TRANSLATION_LLM_MODEL: "${AFFOGATO_RSS_READER_TRANSLATION_LLM_MODEL:-gpt-4o-mini}"
      AFFOGATO_RSS_READER_TRANSLATION_LLM_API_KEY: "${AFFOGATO_RSS_READER_TRANSLATION_LLM_API_KEY:-}"
      AFFOGATO_RSS_READER_DEEPL_ENDPOINT: "${AFFOGATO_RSS_READER_DEEPL_ENDPOINT:-https://api-free.deepl.com/v2/translate}"
      AFFOGATO_RSS_READER_DEEPL_API_KEY: "${AFFOGATO_RSS_READER_DEEPL_API_KEY:-}"
      AFFOGATO_RSS_READER_GOOGLE_CLOUD_TRANSLATION_API_KEY: "${AFFOGATO_RSS_READER_GOOGLE_CLOUD_TRANSLATION_API_KEY:-}"
      AFFOGATO_RSS_READER_LLM_SUMMARY_TIMEOUT_SECONDS: "${AFFOGATO_RSS_READER_LLM_SUMMARY_TIMEOUT_SECONDS:-30}"
      AFFOGATO_RSS_READER_BRIEF_BATCH_CONCURRENCY: "${AFFOGATO_RSS_READER_BRIEF_BATCH_CONCURRENCY:-2}"
      AFFOGATO_RSS_READER_BRIEF_LLM_MAX_ATTEMPTS: "${AFFOGATO_RSS_READER_BRIEF_LLM_MAX_ATTEMPTS:-4}"
      AFFOGATO_RSS_READER_BRIEF_LLM_RETRY_BASE_SECONDS: "${AFFOGATO_RSS_READER_BRIEF_LLM_RETRY_BASE_SECONDS:-2}"
      AFFOGATO_RSS_READER_SECRET_KEY_FILE: "${AFFOGATO_RSS_READER_SECRET_KEY_FILE:-/app/secrets/master.key}"
      AFFOGATO_RSS_READER_SECRET_KEY_PREVIOUS_FILES: "${AFFOGATO_RSS_READER_SECRET_KEY_PREVIOUS_FILES:-}"
      AFFOGATO_RSS_READER_CALL_LOG_FILE: "${AFFOGATO_RSS_READER_CALL_LOG_FILE:-/app/logs/llm-translation.jsonl}"
      AFFOGATO_RSS_READER_CALL_LOG_MAX_BYTES: "${AFFOGATO_RSS_READER_CALL_LOG_MAX_BYTES:-10485760}"
      AFFOGATO_RSS_READER_CALL_LOG_BACKUPS: "${AFFOGATO_RSS_READER_CALL_LOG_BACKUPS:-5}"
      AFFOGATO_RSS_READER_BACKUP_KEEP_DAYS: "${AFFOGATO_RSS_READER_BACKUP_KEEP_DAYS:-30}"
      AFFOGATO_RSS_READER_BACKUP_MAX_COUNT: "${AFFOGATO_RSS_READER_BACKUP_MAX_COUNT:-14}"
      AFFOGATO_RSS_READER_BACKUP_MIN_COUNT: "${AFFOGATO_RSS_READER_BACKUP_MIN_COUNT:-2}"
      AFFOGATO_RSS_READER_BACKUP_MAX_TOTAL_BYTES: "${AFFOGATO_RSS_READER_BACKUP_MAX_TOTAL_BYTES:-2147483648}"
      AFFOGATO_RSS_READER_SQLITE_WAL_AUTOCHECKPOINT_PAGES: "${AFFOGATO_RSS_READER_SQLITE_WAL_AUTOCHECKPOINT_PAGES:-1000}"
      AFFOGATO_RSS_READER_SQLITE_JOURNAL_SIZE_LIMIT_BYTES: "${AFFOGATO_RSS_READER_SQLITE_JOURNAL_SIZE_LIMIT_BYTES:-67108864}"
      AFFOGATO_RSS_READER_UPDATE_CHECK_ENABLED: "${AFFOGATO_RSS_READER_UPDATE_CHECK_ENABLED:-true}"
      AFFOGATO_RSS_READER_UPDATE_CHECK_HOUR: "${AFFOGATO_RSS_READER_UPDATE_CHECK_HOUR:-5}"
      AFFOGATO_RSS_READER_UPDATE_CONTROL_DIR: /app/update-control
      AFFOGATO_RSS_READER_UPDATE_GITHUB_REPOSITORY: ImVictorCheng/affogato-rss-reader
      AFFOGATO_RSS_READER_UPDATE_IMAGE_REPOSITORY: ghcr.io/imvictorcheng/affogato-rss-reader
    volumes:
      - affogato-rss-reader-data:/app/data
      - affogato-rss-reader-secrets:/app/secrets
      - affogato-rss-reader-update-control:/app/update-control
      - ./logs:/app/logs

  updater:
    image: *reader-image
    user: "0:0"
    command: ["python", "-m", "backend.app.update_runner"]
    healthcheck:
      disable: true
    restart: unless-stopped
    depends_on:
      log-init:
        condition: service_completed_successfully
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      AFFOGATO_RSS_READER_DATA_DIR: /app/data
      AFFOGATO_RSS_READER_UPDATE_CONTROL_DIR: /app/update-control
      AFFOGATO_RSS_READER_UPDATE_WORKSPACE_DIR: /workspace
      AFFOGATO_RSS_READER_UPDATE_GITHUB_REPOSITORY: ImVictorCheng/affogato-rss-reader
      AFFOGATO_RSS_READER_UPDATE_IMAGE_REPOSITORY: ghcr.io/imvictorcheng/affogato-rss-reader
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace
      - affogato-rss-reader-data:/app/data:ro
      - affogato-rss-reader-update-control:/app/update-control
    tmpfs:
      - /tmp
      - /app/secrets

volumes:
  affogato-rss-reader-data:
  affogato-rss-reader-secrets:
  affogato-rss-reader-update-control:
