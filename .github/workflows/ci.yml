name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_call:

permissions: {}

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.lock
      - run: python -m pip install -r requirements-test.lock
      - run: python -m pip install --no-deps -e backend
      - run: python scripts/check_version.py
      - run: python scripts/check_utf8.py
      - run: python scripts/check_supply_chain_pins.py
      - run: pytest backend/tests --cov=backend.app --cov-report=term-missing

  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check:ui
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  container:
    name: Container (${{ matrix.platform }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    env:
      CI_IMAGE: affogato-rss-reader:ci-${{ matrix.arch }}
      CI_CONTAINER: affogato-rss-reader-ci-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Resolve build metadata
        id: build-metadata
        shell: bash
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ env.CI_IMAGE }}
          build-args: |
            VERSION=${{ steps.build-metadata.outputs.version }}
            VCS_REF=${{ github.sha }}
            SOURCE_URL=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=container-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.arch }}
      - name: Reject High or Critical vulnerabilities in the built image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ env.CI_IMAGE }}
          fail-build: true
          severity-cutoff: high
          only-fixed: false
          output-format: table
          grype-version: v0.116.1
          config: .grype.yaml
      - name: Update helper smoke test
        run: docker run --rm "$CI_IMAGE" python -c 'import backend.app.update_runner; print("update helper import ok")'
      - name: Empty-library smoke test
        run: |
          docker run -d --name "$CI_CONTAINER" -p 18787:8787 -e AFFOGATO_RSS_READER_AUTH_MODE=none "$CI_IMAGE"
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:18787/api/v1/health && break
            sleep 2
          done
          test "$(curl --fail --silent http://127.0.0.1:18787/api/v1/feeds | python -c 'import json,sys; print(len(json.load(sys.stdin)["items"]))')" = "0"
          test "$(docker exec "$CI_CONTAINER" python -c 'import sqlite3; print(sqlite3.connect("/app/data/affogato-rss-reader.db").execute("select version_num from alembic_version").fetchone()[0])')" = "0012"
          test "$(docker exec "$CI_CONTAINER" python -c 'import sqlite3; print(sqlite3.connect("/app/data/affogato-rss-reader.db").execute("pragma foreign_key_check").fetchall())')" = "[]"
          docker exec "$CI_CONTAINER" grep --quiet "MIT License" /usr/share/licenses/affogato-rss-reader/LICENSE
          docker logs "$CI_CONTAINER"
      - if: always()
        run: docker rm -f "$CI_CONTAINER" || true
      - name: Linux call-log bind mount smoke test
        run: |
          log_dir="$(mktemp -d)"
          docker run --rm --user 0:0 -v "${log_dir}:/app/logs" "$CI_IMAGE" sh -c 'chown 10001:10001 /app/logs && chmod 0755 /app/logs'
          docker run --rm -e AFFOGATO_RSS_READER_CALL_LOG_FILE=/app/logs/llm-translation.jsonl -v "${log_dir}:/app/logs" "$CI_IMAGE" python -c 'from backend.app.call_logging import write_call_log; write_call_log(category="llm", operation="ci-smoke", status="success", duration_ms=0)'
          test -s "${log_dir}/llm-translation.jsonl"
